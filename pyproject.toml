[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "premortem"
version = "0.1.0"
description = "DataHub schema-change rehearsal: query-level hard/soft/unknown breakage forecasts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "sqlglot>=25.0.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
datahub = [
  "httpx>=0.27.0",
  "datahub-agent-context>=1.6.0",
  "acryl-datahub>=1.6.0",
]
mcp = ["mcp[cli]>=1.0"]
all = ["premortem[datahub,mcp,dev]"]

[project.scripts]
premortem = "premortem.cli:main"
premortem-mcp = "premortem.mcp_server:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
