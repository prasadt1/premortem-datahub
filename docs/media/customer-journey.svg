<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="800" fill="#fcfcfb"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#898781"/>
    </marker>
  </defs>

  <text x="60" y="56" font-size="30" font-weight="700" fill="#0b0b0b">Who it is for - and what happens</text>
  <text x="60" y="90" font-size="18" fill="#52514e">A data engineer about to merge a column rename. Premortem is the rehearsal step.</text>

  <rect x="60" y="118" width="1080" height="88" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <rect x="60" y="118" width="6" height="88" rx="3" fill="#eb6834"/>
  <text x="88" y="152" font-size="13" font-weight="600" fill="#898781" letter-spacing="0.6">PRIMARY USER</text>
  <text x="88" y="182" font-size="20" font-weight="700" fill="#0b0b0b">Data / analytics engineer owning a warehouse table</text>
  <text x="700" y="182" font-size="16" fill="#52514e">Job: Can I merge this rename on Friday?</text>

  <rect x="60" y="240" width="200" height="200" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="80" y="274" font-size="13" font-weight="600" fill="#898781" letter-spacing="0.6">1 - TRIGGER</text>
  <text x="80" y="310" font-size="18" font-weight="700" fill="#0b0b0b">PR or ticket</text>
  <text x="80" y="340" font-size="15" fill="#52514e">Rename or drop a</text>
  <text x="80" y="362" font-size="15" fill="#52514e">column on a table</text>
  <text x="80" y="384" font-size="15" fill="#52514e">you own.</text>
  <text x="80" y="416" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">order_status -&gt;</text>
  <text x="80" y="436" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">order_state</text>

  <path d="M268 340 L312 340" stroke="#898781" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="320" y="240" width="200" height="200" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="340" y="274" font-size="13" font-weight="600" fill="#898781" letter-spacing="0.6">2 - TODAY</text>
  <text x="340" y="310" font-size="18" font-weight="700" fill="#0b0b0b">Impact Analysis</text>
  <text x="340" y="340" font-size="15" fill="#52514e">A list of what is</text>
  <text x="340" y="362" font-size="15" fill="#52514e">connected. Not which</text>
  <text x="340" y="384" font-size="15" fill="#52514e">queries break, or how.</text>
  <text x="340" y="422" font-size="15" font-weight="600" fill="#d03b3b">Guess, ship, or stall.</text>

  <path d="M528 340 L572 340" stroke="#898781" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="580" y="240" width="200" height="200" rx="12" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="600" y="274" font-size="13" font-weight="600" fill="#2a78d6" letter-spacing="0.6">3 - ASK THE AGENT</text>
  <text x="600" y="310" font-size="18" font-weight="700" fill="#0b0b0b">Plain language</text>
  <text x="600" y="340" font-size="15" fill="#52514e">Claude / Cursor with</text>
  <text x="600" y="362" font-size="15" fill="#52514e">DataHub MCP +</text>
  <text x="600" y="384" font-size="15" fill="#52514e">Premortem MCP.</text>
  <text x="600" y="422" font-size="14" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">rehearse_schema...</text>

  <path d="M788 340 L832 340" stroke="#898781" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="840" y="240" width="300" height="200" rx="12" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
  <text x="860" y="274" font-size="13" font-weight="600" fill="#eb6834" letter-spacing="0.6">4 - FORECAST</text>
  <text x="860" y="310" font-size="18" font-weight="700" fill="#0b0b0b">Per-query verdicts</text>
  <text x="860" y="342" font-size="15" fill="#52514e">Under the lineage baseline:</text>
  <text x="860" y="372" font-size="15" font-weight="700" fill="#d03b3b">HARD</text>
  <text x="920" y="372" font-size="15" font-weight="700" fill="#0ca30c">SOFT</text>
  <text x="980" y="372" font-size="15" font-weight="700" fill="#b8860b">UNKNOWN</text>
  <text x="860" y="398" font-size="15" font-weight="700" fill="#2a78d6">CLEARED</text>
  <text x="860" y="430" font-size="15" fill="#52514e">+ ready-to-apply write_payload</text>

  <path d="M990 448 L990 500" stroke="#898781" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="60" y="508" width="1080" height="168" rx="12" fill="#ffffff" stroke="#0ca30c" stroke-width="2"/>
  <text x="88" y="544" font-size="13" font-weight="600" fill="#0ca30c" letter-spacing="0.6">5 - WRITE-BACK - NEXT PERSON INHERITS IT</text>
  <text x="88" y="580" font-size="19" font-weight="700" fill="#0b0b0b">DataHub Quality tab - custom assertion - premortem_forecast tag - description</text>
  <text x="88" y="614" font-size="16" fill="#52514e">Host agent applies the payload through DataHub's own mutation tools. Premortem never writes the catalog itself.</text>
  <text x="88" y="646" font-size="16" fill="#52514e">Secondary user: platform engineer who opens the dataset later and sees the rehearsal already there.</text>

  <text x="60" y="728" font-size="16" fill="#52514e">Compose with any DataHub (local Quickstart or your GMS). Judges verify the claim without a catalog:</text>
  <text x="60" y="760" font-size="18" font-weight="700" fill="#0b0b0b">prasadt1.github.io/premortem-datahub  -  python eval/run_eval.py -&gt; 0.97 / 1.00 / 0.00</text>
</svg>
