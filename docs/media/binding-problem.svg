<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="800" fill="#fcfcfb"/>

  <text x="60" y="62" font-size="30" font-weight="700" fill="#0b0b0b">Two tables. Same column name. Only one is breaking.</text>
  <text x="60" y="96" font-size="18" fill="#52514e">Renaming <tspan font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">order_history.order_status</tspan> → <tspan font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">order_state</tspan></text>

  <!-- schema strip -->
  <g>
    <rect x="60" y="128" width="480" height="112" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <rect x="60" y="128" width="6" height="112" rx="3" fill="#2a78d6"/>
    <text x="84" y="158" font-size="13" font-weight="600" fill="#898781" letter-spacing="0.6">SUBJECT OF THE CHANGE</text>
    <text x="84" y="186" font-size="19" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">analytics.order_history</text>
    <text x="84" y="216" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#52514e">order_id · customer_id · <tspan font-weight="700" fill="#0b0b0b">order_status</tspan> · …</text>
  </g>
  <g>
    <rect x="660" y="128" width="480" height="112" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <rect x="660" y="128" width="6" height="112" rx="3" fill="#898781"/>
    <text x="684" y="158" font-size="13" font-weight="600" fill="#898781" letter-spacing="0.6">A DIFFERENT TABLE — ALSO A DEPENDENT</text>
    <text x="684" y="186" font-size="19" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">logistics.shipments</text>
    <text x="684" y="216" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#52514e">shipment_id · order_id · <tspan font-weight="700" fill="#0b0b0b">order_status</tspan> · …</text>
  </g>

  <!-- the query -->
  <rect x="60" y="272" width="1080" height="74" rx="10" fill="#f4f4f1" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="84" y="302" font-size="13" font-weight="600" fill="#898781" letter-spacing="0.6">A QUERY IN YOUR WAREHOUSE HISTORY</text>
  <text x="84" y="330" font-size="17" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">SELECT s.shipment_id FROM <tspan font-weight="700">shipments</tspan> s WHERE <tspan font-weight="700">s.order_status</tspan> = 'SHIPPED'</text>

  <!-- left path: name matching -->
  <g>
    <rect x="60" y="392" width="520" height="286" rx="12" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
    <text x="88" y="430" font-size="13" font-weight="600" fill="#898781" letter-spacing="0.6">MATCH ON COLUMN NAME</text>
    <text x="88" y="462" font-size="21" font-weight="700" fill="#0b0b0b">What a lineage-only check does</text>

    <text x="88" y="506" font-size="16" fill="#52514e">The string <tspan font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#0b0b0b">order_status</tspan> appears,</text>
    <text x="88" y="530" font-size="16" fill="#52514e">and it appears inside a <tspan font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#0b0b0b">WHERE</tspan> clause.</text>

    <rect x="88" y="558" width="200" height="44" rx="8" fill="#d03b3b"/>
    <text x="188" y="587" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">HARD — breaks</text>

    <g transform="translate(88,626)">
      <circle cx="13" cy="13" r="13" fill="#d03b3b"/>
      <path d="M7.5 7.5 L18.5 18.5 M18.5 7.5 L7.5 18.5" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
      <text x="36" y="19" font-size="17" font-weight="600" fill="#d03b3b">False alarm — nothing here breaks</text>
    </g>
  </g>

  <!-- right path: binding -->
  <g>
    <rect x="620" y="392" width="520" height="286" rx="12" fill="#ffffff" stroke="#0ca30c" stroke-width="2"/>
    <text x="648" y="430" font-size="13" font-weight="600" fill="#898781" letter-spacing="0.6">RESOLVE WHAT IT BINDS TO</text>
    <text x="648" y="462" font-size="21" font-weight="700" fill="#0b0b0b">What Premortem does</text>

    <text x="648" y="506" font-size="16" fill="#52514e">Alias <tspan font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#0b0b0b">s</tspan> resolves to <tspan font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#0b0b0b">shipments</tspan>,</text>
    <text x="648" y="530" font-size="16" fill="#52514e">which is not the table being changed.</text>

    <rect x="648" y="558" width="200" height="44" rx="8" fill="#0ca30c"/>
    <text x="748" y="587" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">CLEARED</text>

    <g transform="translate(648,626)">
      <circle cx="13" cy="13" r="13" fill="#0ca30c"/>
      <path d="M7 13.5 L11.2 17.8 L19 9.4" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="36" y="19" font-size="17" font-weight="600" fill="#0ca30c">Named and dismissed, not silently dropped</text>
    </g>
  </g>

  <!-- measured impact -->
  <text x="60" y="736" font-size="17" fill="#52514e">Measured on the frozen evaluation — false-positive rate on the decoy stratum:</text>
  <text x="60" y="770" font-size="24" font-weight="700" fill="#0b0b0b"><tspan fill="#898781">0.50</tspan>  →  <tspan fill="#0ca30c">0.00</tspan></text>
  <text x="248" y="770" font-size="17" fill="#52514e">6 decoy queries, zero false alarms after binding</text>
</svg>
