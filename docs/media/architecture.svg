<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="800" fill="#fcfcfb"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#898781"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#eb6834"/>
    </marker>
  </defs>

  <text x="60" y="42" font-size="26" font-weight="700" fill="#0b0b0b">How Premortem is wired</text>
  <text x="60" y="68" font-size="15" fill="#52514e">Three ways in. One pure core. Catalog access only when live — behind one protocol, three backends.</text>

  <!-- ========== 1. ENTRY POINTS (equal) ========== -->
  <text x="60" y="98" font-size="12" font-weight="600" fill="#898781" letter-spacing="0.6">1 - HOW YOU INVOKE IT (three equal entry points)</text>

  <rect x="60" y="110" width="340" height="70" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="80" y="138" font-size="16" font-weight="700" fill="#0b0b0b">CLI</text>
  <text x="80" y="160" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#52514e">premortem  ·  premortem gate</text>

  <rect x="430" y="108" width="340" height="74" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="2"/>
  <text x="450" y="134" font-size="16" font-weight="700" fill="#0b0b0b">Premortem MCP</text>
  <text x="450" y="154" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#52514e">rehearse_schema_change</text>
  <text x="450" y="170" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#52514e">explain_finding</text>

  <rect x="800" y="110" width="340" height="70" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="820" y="138" font-size="16" font-weight="700" fill="#0b0b0b">Eval harness</text>
  <text x="820" y="160" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#52514e">run_eval · run_repair_roundtrip</text>

  <!-- Three explicit arrows from each entry into the core -->
  <path d="M230 180 L230 208" stroke="#898781" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M600 182 L600 208" stroke="#eb6834" stroke-width="2.5" marker-end="url(#aro)"/>
  <path d="M970 180 L970 208" stroke="#898781" stroke-width="2" marker-end="url(#ar)"/>
  <text x="415" y="200" font-size="11" fill="#898781" text-anchor="middle">all call the same library</text>

  <!-- ========== 2. CORE ========== -->
  <rect x="60" y="210" width="1080" height="250" rx="12" fill="#fbf6f2" stroke="#eb6834" stroke-width="2"/>
  <text x="80" y="236" font-size="12" font-weight="700" fill="#eb6834" letter-spacing="0.6">2 - CORE LIBRARY (pure Python · no DataHub import · no LLM import)</text>

  <!-- Binder -->
  <rect x="80" y="252" width="280" height="188" rx="10" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/>
  <text x="100" y="280" font-size="12" font-weight="600" fill="#898781" letter-spacing="0.5">THE ONE BINDER</text>
  <text x="100" y="308" font-size="16" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">analyze_bindings</text>
  <text x="100" y="336" font-size="13" fill="#52514e">parse SQL</text>
  <text x="100" y="356" font-size="13" fill="#52514e">resolve each column to a table</text>
  <text x="100" y="376" font-size="13" fill="#52514e">score the clause</text>
  <text x="100" y="408" font-size="13" font-weight="700" fill="#eb6834">if unsure: refuse (UNKNOWN)</text>

  <!-- Three fan-out arrows - each to its own consumer -->
  <path d="M360 300 L400 300" stroke="#0b0b0b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M360 346 L400 346" stroke="#0b0b0b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M360 392 L400 392" stroke="#0b0b0b" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="408" y="278" width="250" height="44" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="424" y="306" font-size="14" font-weight="600" fill="#0b0b0b">classify · forecast · rank</text>

  <rect x="408" y="324" width="250" height="44" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="424" y="352" font-size="14" font-weight="600" fill="#0b0b0b">rewrite (SQL repair patches)</text>

  <rect x="408" y="370" width="250" height="44" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="424" y="398" font-size="14" font-weight="600" fill="#0b0b0b">gate · notify · report</text>

  <!-- Callout -->
  <rect x="690" y="278" width="420" height="136" rx="10" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="710" y="308" font-size="14" fill="#52514e">Same binder for classify and repair —</text>
  <text x="710" y="330" font-size="14" fill="#52514e">no second resolver that can drift.</text>
  <text x="710" y="358" font-size="14" fill="#52514e">A patch ships only when this binder</text>
  <text x="710" y="380" font-size="14" fill="#52514e">bound the column to the subject table.</text>

  <!-- ========== 3. CATALOG PROTOCOL ========== -->
  <text x="60" y="482" font-size="12" font-weight="600" fill="#898781" letter-spacing="0.6">3 - CATALOG ACCESS</text>
  <text x="210" y="482" font-size="12" fill="#898781">one protocol; swap the backend, core unchanged</text>

  <!-- Core bottom (460) -> protocol top (498); label clear of the shaft -->
  <path d="M600 460 L600 496" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arb)"/>
  <text x="720" y="482" font-size="11" fill="#2a78d6">live / MCP path only</text>

  <!-- Protocol bar spanning the three backends -->
  <rect x="60" y="498" width="1080" height="36" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="80" y="522" font-size="15" font-weight="700" fill="#0b0b0b">CatalogClient protocol</text>
  <text x="320" y="522" font-size="13" fill="#52514e">reads: schema · lineage · queries · owners   |   writes: tag · description · assertion</text>

  <!-- Three implementors hanging from the protocol -->
  <path d="M230 534 L230 552" stroke="#2a78d6" stroke-width="2" marker-end="url(#arb)"/>
  <path d="M600 534 L600 552" stroke="#2a78d6" stroke-width="2" marker-end="url(#arb)"/>
  <path d="M970 534 L970 552" stroke="#898781" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="60" y="556" width="340" height="58" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="80" y="580" font-size="14" font-weight="700" fill="#0b0b0b">Kit (default)</text>
  <text x="80" y="600" font-size="12" fill="#52514e">Agent Context Kit — live reads/writes</text>

  <rect x="430" y="556" width="340" height="58" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="450" y="580" font-size="14" font-weight="700" fill="#0b0b0b">GraphQL (fallback)</text>
  <text x="450" y="600" font-size="12" fill="#52514e">+ assertion write (OSS MCP gap #151)</text>

  <rect x="800" y="556" width="340" height="58" rx="8" fill="#ffffff" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="820" y="580" font-size="14" font-weight="700" fill="#0b0b0b">Fake (tests / offline eval)</text>
  <text x="820" y="600" font-size="12" fill="#52514e">in-memory — never talks to DataHub</text>

  <!-- Only Kit + GraphQL reach DataHub -->
  <path d="M230 614 L230 640" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arb)"/>
  <path d="M600 614 L600 640" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arb)"/>
  <text x="970" y="630" font-size="11" fill="#898781" text-anchor="middle">no DataHub link</text>

  <!-- ========== 4. DATAHUB ========== -->
  <rect x="60" y="644" width="720" height="86" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <text x="80" y="670" font-size="12" font-weight="600" fill="#2a78d6" letter-spacing="0.6">4 - DATAHUB (external catalog)</text>
  <text x="80" y="696" font-size="13" fill="#0b0b0b"><tspan font-weight="700">Reads</tspan> history · lineage · schema · owners</text>
  <text x="80" y="716" font-size="13" fill="#0b0b0b"><tspan font-weight="700">Writes</tspan> tag + description (DataHub MCP) · assertion (GraphQL)</text>

  <!-- Side note for Fake/eval -->
  <rect x="800" y="644" width="340" height="86" rx="10" fill="#f4f4f1" stroke="#e1e0d9" stroke-width="1.5"/>
  <text x="820" y="674" font-size="13" font-weight="700" fill="#0b0b0b">Why eval needs no DataHub</text>
  <text x="820" y="698" font-size="12" fill="#52514e">Harness + Fake backend hit the core</text>
  <text x="820" y="716" font-size="12" fill="#52514e">only — that is why 0.97 is reproducible offline.</text>
</svg>
