<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="800" fill="#fcfcfb"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#52514e"/>
    </marker>
    <marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6b7a"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#eb6834"/>
    </marker>
    <!-- Official MCP mark (modelcontextprotocol favicon paths), scaled for icon use -->
    <g id="mcp-logo">
      <path d="M18 84.8528L85.8822 16.9706C95.2548 7.59798 110.451 7.59798 119.823 16.9706V16.9706C129.196 26.3431 129.196 41.5391 119.823 50.9117L68.5581 102.177" fill="none" stroke="#0b0b0b" stroke-width="12" stroke-linecap="round"/>
      <path d="M69.2652 101.47L119.823 50.9117C129.196 41.5391 144.392 41.5391 153.765 50.9117L154.118 51.2652C163.491 60.6378 163.491 75.8338 154.118 85.2063L92.7248 146.6C89.6006 149.724 89.6006 154.789 92.7248 157.913L105.331 170.52" fill="none" stroke="#0b0b0b" stroke-width="12" stroke-linecap="round"/>
      <path d="M102.853 33.9411L52.6482 84.1457C43.2756 93.5183 43.2756 108.714 52.6482 118.087V118.087C62.0208 127.459 77.2167 127.459 86.5893 118.087L136.794 67.8822" fill="none" stroke="#0b0b0b" stroke-width="12" stroke-linecap="round"/>
    </g>
  </defs>

  <text x="60" y="36" font-size="24" font-weight="700" fill="#0b0b0b">How Premortem is wired</text>
  <text x="60" y="58" font-size="14" fill="#52514e">Three ways in. One pure core. Catalog access only when live — behind one protocol, three backends.</text>

  <!-- ===== BAND 1: INVOKE ===== -->
  <rect x="48" y="72" width="1104" height="148" rx="12" fill="#eceae4" stroke="#898781" stroke-width="2"/>
  <text x="68" y="96" font-size="14" font-weight="700" fill="#0b0b0b" letter-spacing="0.4">1  ·  HOW YOU INVOKE IT</text>
  <text x="300" y="96" font-size="13" font-weight="600" fill="#52514e">three equal doors into the same library</text>

  <!-- CLI -->
  <rect x="68" y="112" width="320" height="92" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
  <rect x="86" y="128" width="22" height="18" rx="3" fill="none" stroke="#0b0b0b" stroke-width="1.5"/>
  <path d="M92 134 L98 137 L92 140" fill="none" stroke="#0b0b0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="100" y1="140" x2="104" y2="140" stroke="#0b0b0b" stroke-width="1.5" stroke-linecap="round"/>
  <text x="118" y="142" font-size="15" font-weight="700" fill="#0b0b0b">CLI</text>
  <text x="86" y="174" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">premortem · premortem gate</text>

  <!-- Premortem MCP + official MCP logo -->
  <rect x="408" y="108" width="320" height="96" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="2.5"/>
  <use href="#mcp-logo" transform="translate(418,118) scale(0.14)"/>
  <text x="452" y="135" font-size="15" font-weight="700" fill="#0b0b0b">Premortem MCP</text>
  <text x="452" y="151" font-size="11" font-weight="600" fill="#eb6834">we built this</text>
  <text x="426" y="172" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">rehearse_schema_change</text>
  <text x="426" y="188" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">explain_finding</text>

  <!-- Eval -->
  <rect x="748" y="112" width="380" height="92" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="1.5"/>
  <path d="M768 126 L768 136 L760 150 L784 150 L776 136 L776 126 Z" fill="none" stroke="#0b0b0b" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="764" y1="126" x2="780" y2="126" stroke="#0b0b0b" stroke-width="1.5" stroke-linecap="round"/>
  <text x="794" y="142" font-size="15" font-weight="700" fill="#0b0b0b">Eval harness</text>
  <text x="766" y="174" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">run_eval · run_repair_roundtrip</text>

  <path d="M228 220 L228 242" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M568 220 L568 242" stroke="#eb6834" stroke-width="2.5" marker-end="url(#aro)"/>
  <path d="M938 220 L938 242" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/>
  <text x="398" y="236" font-size="11" font-weight="600" fill="#52514e" text-anchor="middle">all call the same library</text>

  <!-- ===== BAND 2: CORE (orange = Premortem product) ===== -->
  <rect x="48" y="244" width="1104" height="220" rx="12" fill="#fbf6f2" stroke="#eb6834" stroke-width="2.5"/>
  <text x="68" y="268" font-size="13" font-weight="700" fill="#eb6834" letter-spacing="0.4">2  ·  CORE LIBRARY</text>
  <text x="220" y="268" font-size="13" fill="#0b0b0b">pure Python · catalog-agnostic · composes with DataHub · no LLM</text>

  <rect x="68" y="284" width="280" height="158" rx="10" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/>
  <text x="88" y="308" font-size="11" font-weight="700" fill="#52514e" letter-spacing="0.5">THE ONE BINDER</text>
  <text x="88" y="332" font-size="15" font-weight="700" font-family="ui-monospace, Menlo, monospace" fill="#0b0b0b">analyze_bindings</text>
  <text x="88" y="356" font-size="13" fill="#0b0b0b">parse SQL</text>
  <text x="88" y="376" font-size="13" fill="#0b0b0b">resolve each column to a table</text>
  <text x="88" y="396" font-size="13" fill="#0b0b0b">score the clause</text>
  <text x="88" y="422" font-size="13" font-weight="700" fill="#eb6834">if unsure: refuse (UNKNOWN)</text>

  <path d="M348 316 L388 316" stroke="#0b0b0b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M348 362 L388 362" stroke="#0b0b0b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M348 408 L388 408" stroke="#0b0b0b" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="396" y="294" width="260" height="44" rx="8" fill="#ffffff" stroke="#a8a59d" stroke-width="1.5"/>
  <text x="412" y="322" font-size="14" font-weight="700" fill="#0b0b0b">classify · forecast · rank</text>
  <rect x="396" y="340" width="260" height="44" rx="8" fill="#ffffff" stroke="#a8a59d" stroke-width="1.5"/>
  <text x="412" y="368" font-size="14" font-weight="700" fill="#0b0b0b">rewrite (SQL repair patches)</text>
  <rect x="396" y="386" width="260" height="44" rx="8" fill="#ffffff" stroke="#a8a59d" stroke-width="1.5"/>
  <text x="412" y="414" font-size="14" font-weight="700" fill="#0b0b0b">gate · notify · report</text>

  <rect x="688" y="294" width="440" height="136" rx="10" fill="#ffffff" stroke="#a8a59d" stroke-width="1.5"/>
  <text x="708" y="324" font-size="14" fill="#0b0b0b">Same binder for classify and repair —</text>
  <text x="708" y="346" font-size="14" fill="#0b0b0b">no second resolver that can drift.</text>
  <text x="708" y="374" font-size="14" fill="#0b0b0b">A patch ships only when this binder</text>
  <text x="708" y="396" font-size="14" fill="#0b0b0b">bound the column to the subject table.</text>

  <!-- core -> catalog (slate = our access layer) -->
  <path d="M600 464 L600 490" stroke="#5c6b7a" stroke-width="2.5" marker-end="url(#ars)"/>
  <text x="720" y="482" font-size="11" font-weight="600" fill="#5c6b7a">live / MCP path only</text>

  <!-- ===== BAND 3: CATALOG ACCESS (slate = our adapter, not DataHub) ===== -->
  <rect x="48" y="492" width="1104" height="168" rx="12" fill="#eef1f4" stroke="#5c6b7a" stroke-width="2"/>
  <text x="68" y="516" font-size="13" font-weight="700" fill="#5c6b7a" letter-spacing="0.4">3  ·  CATALOG ACCESS</text>
  <text x="240" y="516" font-size="13" fill="#0b0b0b">our adapter layer — not DataHub itself</text>

  <rect x="68" y="530" width="1064" height="34" rx="8" fill="#ffffff" stroke="#5c6b7a" stroke-width="2"/>
  <text x="86" y="552" font-size="14" font-weight="700" fill="#0b0b0b">CatalogClient protocol</text>
  <text x="310" y="552" font-size="12" fill="#0b0b0b">reads: schema · lineage · queries · owners  |  writes: tag · description · assertion</text>

  <!-- real shafts protocol -> backends -->
  <path d="M228 564 L228 598" stroke="#5c6b7a" stroke-width="2" marker-end="url(#ars)"/>
  <path d="M600 564 L600 598" stroke="#5c6b7a" stroke-width="2" marker-end="url(#ars)"/>
  <path d="M970 564 L970 598" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="68" y="602" width="320" height="44" rx="8" fill="#ffffff" stroke="#5c6b7a" stroke-width="2"/>
  <text x="86" y="622" font-size="13" font-weight="700" fill="#0b0b0b">Kit (default)</text>
  <text x="86" y="638" font-size="11" fill="#0b0b0b">Agent Context Kit — live reads/writes</text>

  <rect x="408" y="602" width="340" height="44" rx="8" fill="#ffffff" stroke="#5c6b7a" stroke-width="1.5"/>
  <text x="426" y="622" font-size="13" font-weight="700" fill="#0b0b0b">GraphQL (fallback)</text>
  <text x="426" y="638" font-size="11" fill="#0b0b0b">+ writes Quality assertion via GraphQL (MCP can't)</text>

  <rect x="768" y="602" width="364" height="44" rx="8" fill="#ffffff" stroke="#a8a59d" stroke-width="1.5"/>
  <text x="786" y="622" font-size="13" font-weight="700" fill="#0b0b0b">Fake (tests / offline eval)</text>
  <text x="786" y="638" font-size="11" fill="#0b0b0b">in-memory — for tests and offline measurement</text>

  <!-- gap between 3 and 4; Kit/GraphQL reach DataHub across it -->
  <path d="M228 646 L228 678" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arb)"/>
  <path d="M578 646 L578 678" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#arb)"/>
  <text x="950" y="672" font-size="11" font-weight="600" fill="#52514e" text-anchor="middle">offline — no live catalog</text>

  <!-- ===== BAND 4: DATAHUB (blue = external platform) ===== -->
  <rect x="48" y="680" width="700" height="100" rx="12" fill="#e8f1fa" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="68" y="704" font-size="13" font-weight="700" fill="#2a78d6" letter-spacing="0.4">4  ·  DATAHUB</text>
  <text x="190" y="704" font-size="13" fill="#0b0b0b">external catalog (platform)</text>
  <text x="68" y="732" font-size="13" fill="#0b0b0b"><tspan font-weight="700">Reads</tspan>  history · lineage · schema · owners</text>
  <text x="68" y="754" font-size="13" fill="#0b0b0b"><tspan font-weight="700">Writes</tspan>  tag + description (DataHub MCP) · assertion (GraphQL)</text>

  <rect x="768" y="680" width="384" height="100" rx="12" fill="#f4f4f1" stroke="#a8a59d" stroke-width="1.5"/>
  <text x="788" y="708" font-size="13" font-weight="700" fill="#0b0b0b">Why the frozen eval runs offline</text>
  <text x="788" y="734" font-size="12" fill="#0b0b0b">Harness + Fake exercise the core only —</text>
  <text x="788" y="754" font-size="12" fill="#0b0b0b">accuracy is measured without a live catalog.</text>
</svg>
