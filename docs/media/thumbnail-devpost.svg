  <path d="M840 660 L960 660" stroke="#eb6834" stroke-width="6" stroke-linecap="round"/>
  <path d="M940 640 L980 660 L940 680" fill="none" stroke="#eb6834" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="900" y="620" font-size="20" font-weight="700" fill="#eb6834" text-anchor="middle">rehearse</text>

  <rect x="1000" y="400" width="720" height="520" rx="24" fill="#161614" stroke="#eb6834" stroke-width="3"/>
