<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" width="1800" height="1200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1800" height="1200" fill="#0b0b0b"/>
